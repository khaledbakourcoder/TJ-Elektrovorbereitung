<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#1B3A5C"/>
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>
  <g transform="translate(400,260)">
    <rect x="-300" y="-160" width="600" height="320" rx="6" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fec007" stroke-width="4"/>
    <circle cx="0" cy="0" r="95" fill="#fec007" opacity="0.15"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#fec007" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#fec007" stroke-width="1" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#fec007" font-size="16" font-weight="bold" font-family="system-ui">⌀ 200 mm</text>
  </g>
  <text x="400" y="460" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="system-ui">Kernbohrung Ergebnis</text>
  <text x="400" y="485" text-anchor="middle" fill="#fec007" font-size="13" font-family="system-ui">Sauberer Durchbruch in Stahlbeton</text>
</svg>
