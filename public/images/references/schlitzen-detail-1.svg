<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#1B3A5C"/>
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>
  <g transform="translate(400,250)">
    <rect x="-250" y="-100" width="500" height="200" rx="4" stroke="#fec007" stroke-width="3" fill="none"/>
    <line x1="-80" y1="-100" x2="-80" y2="100" stroke="#fec007" stroke-width="5"/>
    <line x1="80" y1="-100" x2="80" y2="100" stroke="#fec007" stroke-width="5"/>
    <text x="-80" y="-120" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui" opacity="0.5">Nut 1</text>
    <text x="80" y="-120" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui" opacity="0.5">Nut 2</text>
  </g>
  <text x="400" y="450" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="system-ui">Schlitz-Detailansicht</text>
  <text x="400" y="475" text-anchor="middle" fill="#fec007" font-size="13" font-family="system-ui">Doppelte Nuten für Kabelverlegung</text>
</svg>
