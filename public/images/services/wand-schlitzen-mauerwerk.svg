<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#1B3A5C"/>
  <g opacity="0.08">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)"/>
  </g>
  <g transform="translate(600,400)">
    <rect x="-200" y="-120" width="400" height="240" rx="8" stroke="#fec007" stroke-width="4" fill="none"/>
    <line x1="-100" y1="-120" x2="-100" y2="120" stroke="#fec007" stroke-width="4"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#fec007" stroke-width="4"/>
    <line x1="100" y1="-120" x2="100" y2="120" stroke="#fec007" stroke-width="4"/>
    <path d="M-220 160 L-180 100 L-140 160" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M140 160 L180 100 L220 160" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <text x="600" y="580" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="system-ui">Schlitzen</text>
  <text x="600" y="610" text-anchor="middle" fill="#fec007" font-size="16" font-family="system-ui">Wand- &amp; Bodenschlitze</text>
</svg>
