<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#1B3A5C"/>
  <g opacity="0.08">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)"/>
  </g>
  <g transform="translate(600,360)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#fec007" stroke-width="4"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#fec007" stroke-width="4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fec007" stroke-width="4"/>
    <line x1="-140" y1="0" x2="-90" y2="0" stroke="#fec007" stroke-width="4"/>
    <line x1="90" y1="0" x2="140" y2="0" stroke="#fec007" stroke-width="4"/>
    <line x1="0" y1="-140" x2="0" y2="-90" stroke="#fec007" stroke-width="4"/>
    <line x1="0" y1="90" x2="0" y2="140" stroke="#fec007" stroke-width="4"/>
    <circle cx="0" cy="0" r="20" fill="#fec007" opacity="0.3"/>
  </g>
  <text x="600" y="580" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="system-ui">Kernbohrung</text>
  <text x="600" y="610" text-anchor="middle" fill="#fec007" font-size="16" font-family="system-ui">Diamant-Kernbohrung</text>
</svg>
