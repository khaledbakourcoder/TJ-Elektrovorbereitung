<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#1B3A5C"/>
  <g opacity="0.08">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)"/>
  </g>
  <g transform="translate(600,350)">
    <rect x="-240" y="-80" width="480" height="160" rx="12" fill="none" stroke="#fec007" stroke-width="4"/>
    <g transform="translate(0,-40)">
      <path d="M-200-20 Q-150-60 -80-30 Q0 0 80-30 Q150-60 200-20" stroke="#fec007" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-200 20 Q-150-20 -80 10 Q0 40 80 10 Q150-20 200 20" stroke="#fec007" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(520,320)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="white" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="white" stroke-width="2" opacity="0.3"/>
  </g>
  <text x="600" y="580" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="system-ui">Fräsen</text>
  <text x="600" y="610" text-anchor="middle" fill="#fec007" font-size="16" font-family="system-ui">Beton- &amp; Estrichfräsen</text>
</svg>
